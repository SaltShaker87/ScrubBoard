[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "privatecopy"
version = "0.1.0"
description = "PrivateCopy: removes HIPAA Safe Harbor identifiers from everything you copy. 100% local."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "PrivateCopy contributors" }]
dependencies = [
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "numpy>=1.24",
  "pystray>=0.19",
  "pillow>=10",
  "psutil>=5.9",
  "certifi",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
gliner = ["gliner>=0.2.24"]
hotkey = ["pynput>=1.7"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
privatecopy = "privatecopy.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["privatecopy*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
