# Publishes the download page (docs/site) to GitHub Pages:
# https://<owner>.github.io/<repo>/  (Settings → Pages → Source: GitHub Actions)
name: pages
on:
  push:
    branches: [main]
    paths: ["docs/site/**", "scrubboard/texts.py", "assets/**", "installer/render_texts.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.11" }
      - run: python installer/render_texts.py --site _site
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v5
